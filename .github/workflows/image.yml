name: image

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "egg/**"
      - "scripts/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the egg against Pterodactyl 1.x
        run: python3 scripts/check-egg.py

      - name: Syntax-check the shell scripts
        run: |
          bash -n image/entrypoint.sh
          bash -n image/render-server-toml.sh
          bash -n image/update-server.sh
          bash -n scripts/run-local.sh
          bash -n scripts/verify-server.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/kcdmp
          tags: |
            type=raw,value=10.0
            type=raw,value=latest
            type=sha,format=short

      # amd64 only: the linux/ folder in the KCD:MP release archive is x86-64.
      # An arm64 image would pull and then fail on the server binary with
      # "Exec format error", so it is better not to publish one.
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
